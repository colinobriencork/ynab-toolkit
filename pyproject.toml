[project]
name = "ynab-toolkit"
version = "0.2.0"
description = "Configurable YNAB categorization, budget planning, and verification"
authors = [
    {name = "Colin O'Brien"},
]
dependencies = [
    "httpx>=0.27",
    "playwright>=1.60.0",
    "beautifulsoup4>=4.14.3",
    "pyotp>=2.9.0",
]
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
ynab-toolkit = "ynab_toolkit.__main__:main"
ynab_toolkit = "ynab_toolkit.__main__:main"

[build-system]
requires = ["pdm-backend>=2.4,<3"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["ynab_categorizer/*.py", "ynab_toolkit/*.py"]
source-includes = [".env.example", "config.example.toml", "CHANGELOG.md", "PRIVACY.md", "LICENSE", "docs/REFERENCE.md"]

[tool.pdm.dev-dependencies]
test = [
    "pytest>=8.0",
    "pytest-httpx>=0.34",
    "respx>=0.22",
]

[tool.pdm.scripts]
ynab-toolkit = "python -m ynab_toolkit"
ynab_toolkit = "python -m ynab_toolkit"
categorize = "python -m ynab_toolkit categorize"
assign = "python -m ynab_toolkit assign"
phantom-assign = "python -m ynab_toolkit phantom-assign"
spend-watch = "python -m ynab_toolkit spend-watch"
setup = "python -m ynab_toolkit setup"
amazon-login = "python -m ynab_toolkit amazon-login"
budget-check = "python -m ynab_toolkit budget-check"
correct = "python -m ynab_toolkit correct"
restore = "python -m ynab_toolkit restore"
spending-report = "python -m ynab_toolkit spending-report"
rebalance = "python -m ynab_toolkit rebalance"
export-public = "python scripts/export_public.py"
prepare-release = "python scripts/prepare_release.py"
test = "pytest tests/ -v"

[tool.pytest.ini_options]
testpaths = ["tests"]
